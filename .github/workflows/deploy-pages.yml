name: Deploy ON RED Develop to GitHub Pages

on:
  push:
    branches:
      - main
      - preview/phase2-foundation-2026-11-23
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-develop
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected development ref
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload development site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy development preview
        id: deployment
        uses: actions/deploy-pages@v4
