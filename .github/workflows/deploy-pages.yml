name: Deploy ON RED Develop to GitHub Pages

on:
  push:
    branches:
      - preview/phase2-playtest-2026-11-24
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: phase2-preview
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 2 playtest branch
        uses: actions/checkout@v4
        with:
          ref: preview/phase2-playtest-2026-11-24

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload development preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Phase 2 preview
        id: deployment
        uses: actions/deploy-pages@v4
